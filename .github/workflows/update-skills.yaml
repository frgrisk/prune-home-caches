# Copyright 2026 The Financial Risk Group, Inc.

name: Update Agent Skills

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "update-skills.sh"
      - ".github/workflows/update-skills.yaml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-skills:
    name: Update Agent Skills
    runs-on: [self-hosted, permanent]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise checkout leaves http.https://github.com/.extraheader in the
          # local config, carrying GITHUB_TOKEN. That header beats credentials in
          # a URL, so every github.com fetch from the workspace authenticates as
          # GITHUB_TOKEN and the private source is unreachable. The push step
          # below supplies its own credential instead.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure git
        run: |
          # Redirected so a credential can't linger in the persistent runner's
          # shared ~/.gitconfig. Must be set here, not in job-level env, where
          # the runner context is unavailable.
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig-update-skills" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Scoped to one repo on purpose: a blanket https://github.com/ rewrite also
      # captures this repo's origin, so the PR step would push with a read-only PAT.
      - name: Authenticate git for private skill sources
        env:
          SKILLS_PAT: ${{ secrets.SKILLS_REPO_READ_ONLY_PAT }}
        run: |
          if [[ -z "$SKILLS_PAT" ]]; then
            echo "::warning title=FRG skills not updated::SKILLS_REPO_READ_ONLY_PAT is unset, so frgrisk/skills is skipped and its vendored skills go stale. It is currently the only source, so this run is a no-op."
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${SKILLS_PAT}@github.com/frgrisk/skills".insteadOf \
            "https://github.com/frgrisk/skills"

      - name: Run update script
        run: ./update-skills.sh

      - name: Check for changes
        id: changes
        run: |
          git add .agents/skills/ .claude/skills/ skills-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git reset HEAD -- .agents/skills/ .claude/skills/ skills-lock.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validation summary
        if: github.event_name == 'push'
        run: |
          if [[ "${{ steps.changes.outputs.changed }}" == "true" ]]; then
            echo "::notice title=Updater works, changes found::The script ran and found skill updates. No PR is opened on push; the scheduled run on the default branch does that."
          else
            echo "::notice title=Updater works, already current::The script ran and the vendored skills are up to date."
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/update-agent-skills"
          # checkout ran with persist-credentials: false, so supply the push
          # credential explicitly.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B "$BRANCH"
          git add .agents/skills/ .claude/skills/ skills-lock.json
          git commit -m "$(cat <<'EOF'
          chore: update agent skills

          Automated weekly update of agent skills from upstream packages.
          EOF
          )"

          # Push (force to update existing branch if a PR is already open)
          git push -u origin "$BRANCH" --force-with-lease

          # Create PR only if one doesn't already exist
          if ! gh pr view "$BRANCH" &>/dev/null; then
            gh pr create \
              --base main \
              --title "chore: update agent skills" \
              --body "$(cat <<'EOF'
          ## SUMMARY

          Automated weekly update of vendored agent skills from `frgrisk/skills`.

          Pulled as a curated subset: only the skills already recorded in
          `skills-lock.json` are re-fetched, so nothing new is added silently.

          ## TEST PLAN

          - [ ] Skills list in `.claude/skills/` looks correct
          - [ ] No unexpected files or directories added
          - [ ] `.claude/skills/` entries are still symlinks into `.agents/skills/`
          EOF
          )"
          fi
