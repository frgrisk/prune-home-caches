repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/google/addlicense
    rev: "v1.2.0"
    hooks:
      - id: addlicense
        args:
          [
            "-c",
            "The Financial Risk Group, Inc.",
            "-y",
            "2026",
            "-f",
            "copyright.gotmpl",
            "-ignore",
            ".github/workflows/claude*.yml",
          ]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: "testdata/|.idea/|\\.claude/worktrees/"
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: "testdata/|.idea/|\\.claude/worktrees/"

  # shellcheck-py over koalaman/shellcheck-precommit: no Docker daemon needed.
  # Gated at `warning`; the tree is clean there. Five notes below it are accepted
  # (SC2009 on the `ps | grep`, SC2015 in the harness), so `info` would fail.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Default `types: [markdown]` rather than a `files: ^docs/` scope, so root-level
  # README.md and AGENTS.md are linted too.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: "v0.23.1"
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python dependencies are managed with uv, never pip or Poetry. This hook only
  # matches uv.lock / pyproject.toml / uv.toml, so it stays inert until the repo
  # actually grows a Python project.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.32"
    hooks:
      - id: uv-lock
